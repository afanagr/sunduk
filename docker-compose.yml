# Сундук — веб-файловый менеджер и внешние ссылки для локальной сети.
#
#   * настройки — config/config.yml (переменных окружения нет);
#   * каталоги подключаются в панели: http://<ip-сервера>:8080
#     (первый вход admin / admin, пароль сменится сразу);
#   * запуск:  docker compose up -d --build
#
# Готовый к развёртыванию боевой комплект с образами и инструкцией — в ./deploy
name: sunduk

services:
  sunduk:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: sunduk:latest
    container_name: sunduk
    restart: unless-stopped

    # ---- Сетевые точки ------------------------------------------------------
    # 8080 — панель (только локальная сеть, НЕ пробрасывать на роутере).
    # 8081 — внешние ссылки (именно этот порт открывается наружу).
    ports:
      - "8080:8080"
      - "8081:8081"

    # ---- Хранилища ----------------------------------------------------------
    # Вся файловая система сервера доступна как /host — именно из неё панель
    # берёт каталоги, поэтому ничего добавлять в этот файл не нужно.
    # Нужно ограничить доступ? Смонтируйте только разрешённые каталоги:
    #   - /mnt/media:/host/mnt/media:rw
    #   - /srv/data:/host/srv/data:rw
    volumes:
      - /:/host:rw
      - ./config:/config:ro          # настройки (правки применяет restart)
      - sunduk_data:/data            # база, ключ, временные файлы загрузок

    # ---- Ограничения контейнера --------------------------------------------
    # Контейнер работает от root: он управляет каталогами, владельцами которых
    # могут быть любые пользователи сервера. Всё остальное закрыто.
    read_only: true
    tmpfs:
      - /tmp:size=64m               # загрузки буферизуются в /data/tmp, не здесь

    # Снимаются ВСЕ capabilities, затем возвращаются только те, без которых
    # нельзя работать с чужими файлами: root без CAP_DAC_OVERRIDE не пишет в
    # каталог, принадлежащий другому пользователю (обычное дело для /mnt/media
    # и для тома /data, созданного предыдущей версией).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN          # смена владельца при копировании/перемещении
      - DAC_OVERRIDE   # обход прав доступа: запись в чужие каталоги
      - FOWNER         # смена прав и времени у чужих файлов
    security_opt:
      - no-new-privileges:true

volumes:
  sunduk_data:
    # Фиксированное имя тома: бэкапы и переносы не зависят от имени проекта.
    name: sunduk_data
