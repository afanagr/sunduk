# =============================================================================
#  Сундук — боевое развёртывание
#
#  Запуск:      docker compose up -d --build
#  Панель:      http://<ip-сервера>:8080   (первый вход admin / admin)
#  Ссылки:      http://<ip-сервера>:8081
#  Настройки:   ./config/config.yml        (public_ip — адрес внешних ссылок)
#
#  Переменных окружения нет: всё в config/config.yml. Каталоги подключаются
#  прямо в панели — правка этого файла после установки не требуется.
# =============================================================================
name: sunduk

services:
  sunduk:
    build:
      context: ../server           # исходники лежат в server/ этого же репозитория
      dockerfile: Dockerfile
    image: sunduk:1.1.0
    container_name: sunduk
    restart: unless-stopped

    # 8080 — панель, работает только для локальной сети: НЕ открывайте его
    #        на роутере.
    # 8081 — внешние ссылки: этот порт (или HTTPS-прокси перед ним) наружу.
    ports:
      - "8080:8080"
      - "8081:8081"

    volumes:
      # ---- Каталоги для панели ------------------------------------------
      # Панель показывает то, что доступно внутри этой точки монтирования:
      # путь /mnt/media на сервере = /host/mnt/media в контейнере.
      # По умолчанию смонтирован весь сервер. Чтобы ограничить доступ,
      # закомментируйте строку ниже и перечислите нужные каталоги, например:
      #   - /mnt/media:/host/mnt/media:rw
      #   - /srv/data:/host/srv/data:rw
      - /:/host:rw

      # ---- Служебные тома -----------------------------------------------
      - ./config:/config:ro        # настройки (применяются при restart)
      - sunduk_data:/data          # база, ключ, временные файлы загрузок

    read_only: true
    tmpfs:
      - /tmp:size=64m

    # Все capabilities снимаются, возвращаются только те, без которых нельзя
    # работать с чужими файлами: root без CAP_DAC_OVERRIDE не пишет в каталог,
    # принадлежащий другому пользователю (обычное дело для /mnt/media и для
    # тома /data, созданного предыдущей версией Сундука).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN          # смена владельца при копировании/перемещении
      - DAC_OVERRIDE   # обход прав доступа: запись в чужие каталоги
      - FOWNER         # смена прав и времени у чужих файлов
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sunduk_data:
    # Фиксированное имя тома: бэкапы и переносы не зависят от имени проекта.
    name: sunduk_data
