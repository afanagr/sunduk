# =============================================================================
#  Сундук — универсальный стек: одна и та же установка на Linux, Windows и macOS.
#
#  Рядом ничего не нужно: ни config/config.yml, ни исходников. Образ берётся
#  готовым, все настройки — переменные окружения, каталоги подключаются в самой
#  панели. Подходит для Dockge, Portainer и обычного `docker compose`.
#  В репозитории файл лежит в deploy/ — пути в примерах ниже от корня репозитория.
#
#  Образ: ghcr.io/afanagr/sunduk (linux/amd64 + linux/arm64, публикуется по тегу
#  версии). Пакет в GHCR по умолчанию приватный: либо сделайте его Public
#  (Packages -> sunduk -> Change visibility), либо на хосте выполните
#  docker login ghcr.io. Если образ уже есть локально (docker load из
#  sunduk-<версия>.tar или сборка из исходников) — задайте
#  SUNDUK_IMAGE=sunduk:latest, и тогда ни логин, ни интернет не нужны.
#
#  Переменные (все необязательны, у каждой есть рабочее значение):
#    ADMIN_PORT      порт панели, по умолчанию 8080. Открывать только в LAN,
#                    на роутере не пробрасывать.
#    PUBLIC_PORT     порт внешних ссылок, по умолчанию 8081. Его и открывать
#                    наружу (или ставить перед ним HTTPS-прокси).
#    PUBLIC_ADDRESS  адрес снаружи: IP, домен или https://домен.
#                    Из него строятся все ссылки: http://<адрес>:<PUBLIC_PORT>.
#    HOST_ROOT       что панель видит как файловую систему сервера:
#                      Linux    /              — весь сервер
#                      Windows  C:\Share       — отдельная папка (рекомендуется)
#                      Windows  C:\            — весь диск C:
#                      macOS    /Users         — корень / в Docker Desktop
#                                               недоступен (там файловая
#                                               система его Linux-ВМ).
#                    Безопаснее указывать одну папку: панель тогда физически
#                    не может выйти за её пределы.
#    LAN_ALLOWLIST   кому отвечает панель. По умолчанию локальные сети
#                    (127.0.0.1, ::1, 10/8, 172.16/12, 192.168/16). Перечисление
#                    CIDR через запятую — например "192.168.0.0/16,10.8.0.0/24".
#    CONTAINER_NAME  имя контейнера, по умолчанию sunduk (пригодится, чтобы
#                    поднять второй экземпляр рядом с существующим).
#    DATA_VOLUME     том с базой, ключом и буфером загрузок, по умолчанию
#                    sunduk_data (то же имя, что у остальных стеков Сундука,
#                    поэтому обновление не теряет данные).
#    SUNDUK_IMAGE    образ, по умолчанию ghcr.io/afanagr/sunduk:latest.
#
#  Запуск:     docker compose -f deploy/docker-compose.portable.yml up -d
#  Обновление: docker compose -f deploy/docker-compose.portable.yml pull
#              docker compose -f deploy/docker-compose.portable.yml up -d
#  Панель:     http://<адрес>:<ADMIN_PORT>   (первый вход admin / admin)
# =============================================================================
name: sunduk

services:
  sunduk:
    image: "${SUNDUK_IMAGE:-ghcr.io/afanagr/sunduk:latest}"
    container_name: "${CONTAINER_NAME:-sunduk}"
    restart: unless-stopped

    # Одна переменная задаёт и публикуемый порт, и порт самого приложения:
    # иначе Сундук построил бы внешние ссылки по внутреннему номеру, и они
    # вели бы не туда.
    ports:
      - "${ADMIN_PORT:-8080}:${ADMIN_PORT:-8080}"
      - "${PUBLIC_PORT:-8081}:${PUBLIC_PORT:-8081}"

    environment:
      admin_port: "${ADMIN_PORT:-8080}"
      public_port: "${PUBLIC_PORT:-8081}"
      public_address: "${PUBLIC_ADDRESS:-localhost}"
      # Пустое значение = «не задано»: Сундук возьмёт значение по умолчанию.
      lan_allowlist: "${LAN_ALLOWLIST:-}"
      host_root: /host

    volumes:
      # Файловая система сервера (или выбранная папка) — отсюда панель берёт
      # каталоги. Ограничить доступ: HOST_ROOT=C:\Share (Windows) или
      # HOST_ROOT=/mnt (Linux).
      - "${HOST_ROOT:-/}:/host:rw"
      # База, ключ шифрования и буфер загрузок. Не удаляйте том между
      # обновлениями: вместе с ним исчезнут пароль, каталоги и ссылки.
      - sunduk_data:/data

    # Контейнер работает от root: он управляет каталогами, владельцами которых
    # могут быть любые пользователи сервера. Остальное закрыто.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN          # смена владельца при копировании/перемещении
      - DAC_OVERRIDE   # запись в каталоги чужих пользователей
      - FOWNER         # смена прав и времени у чужих файлов
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sunduk_data:
    # Фиксированное имя тома: бэкапы и переносы не зависят от имени проекта.
    name: "${DATA_VOLUME:-sunduk_data}"
