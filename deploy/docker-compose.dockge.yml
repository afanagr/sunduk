# =============================================================================
#  Сундук — минимальный стек для панелей управления стеками (Dockge, Portainer).
#
#  Рядом ничего не нужно: всё, что настраивается, — переменные окружения ниже,
#  у остального в программе есть готовые значения по умолчанию. Файла
#  config.yml в этой схеме нет вовсе: Сундук читает /config/config.yml, только
#  если он есть, а переменные окружения важнее файла.
#
#  Меняются всего три значения:
#    admin_port     — порт панели (локальная сеть; на роутере не открывать)
#    public_port    — порт внешних ссылок (его и открывать наружу)
#    public_address — адрес снаружи: IP, домен или https://домен
#  Порты ниже 1024 (например 80) потребуют NET_BIND_SERVICE в cap_add —
#  см. закомментированный блок в конце файла.
#
#  Сеть — host: контейнер слушает порты прямо на сервере, поэтому проброса
#  портов и networks в файле нет, а firewall хоста закрывает Сундук как
#  обычную программу (порты, опубликованные Docker, проходят мимо firewall).
#  Нужен Docker на Linux: в Docker Desktop host-сеть живёт внутри его ВМ.
#
#  Запуск:     вставить этот файл как compose.yaml нового стека Dockge -> Deploy
#  Панель:     http://<ip-сервера>:<admin_port>   (первый вход admin / admin)
#  Ссылки:     http://<public_address>:<public_port>
#  Обновление: docker compose pull && docker compose up -d
# =============================================================================
name: sunduk

services:
  sunduk:
    # Образ публикует release.yml по тегу vX.Y.Z. Пакет в GHCR приватный по
    # умолчанию: сделайте его Public (Packages -> sunduk -> Change visibility)
    # либо выполните на сервере docker login ghcr.io.
    image: ghcr.io/afanagr/sunduk:latest
    container_name: sunduk
    restart: unless-stopped

    # Порты слушает сам хост: проброс не нужен, наружу открывается только
    # public_port, а admin_port остаётся доступным лишь из локальной сети.
    network_mode: host

    # --- Всё, что настраивается ------------------------------------------
    # Имена переменных — это ключи config.yml заглавными буквами; нижний
    # регистр (admin_port) и префикс SUNDUK_ тоже принимаются.
    environment:
      # 1. Порты: панель — для локальной сети, ссылки — наружу.
      admin_port: 8080
      public_port: 8081

      # 2. Адрес снаружи — одна строка:
      #      IP:    "95.31.37.196"       -> ссылки http://95.31.37.196:<public_port>
      #      домен: "files.example.com"  -> ссылки http://files.example.com:<public_port>
      #      HTTPS: "https://files.example.com" -> домен за reverse-proxy: ссылки
      #             по https, cookie сессии станут Secure автоматически.
      #    Замените на адрес своего сервера.
      public_address: localhost

      # 3. Необязательно: кому отвечает панель. По умолчанию — только локальные
      #    сети (127.0.0.1, ::1, 10/8, 172.16/12, 192.168/16); снаружи панель и
      #    так закрыта роутером, а доступ из другой подсети или через VPN
      #    включается списком CIDR, например:
      #      lan_allowlist: "192.168.0.0/16,10.8.0.0/24"
      #    Совсем без ограничений (решает только firewall) — "0.0.0.0/0,::/0";
      #    пустой список означал бы «403 всем».

    # --- Хранилище --------------------------------------------------------
    # Файловая система сервера видна как /host — оттуда панель берёт каталоги.
    # Ограничить доступ: закомментируйте строку и перечислите только нужное,
    # например /mnt/media:/host/mnt/media:rw.
    volumes:
      - /:/host:rw

# --- Необязательное ужесточение ----------------------------------------------
# Эти ограничения задаются только при запуске: ни образ, ни сама программа их
# включить не могут, поэтому в минимальном стеке их нет. Снимите «#», если
# нужна максимальная изоляция (тогда /data переедет в ОЗУ и база, пароль и
# ссылки исчезнут при пересоздании контейнера).
#
#    read_only: true
#    tmpfs:
#      - /tmp:size=64m            # загрузки буферизуются в /data/tmp, не здесь
#      - /data:size=512m          # SQLite, secret.key и буфер загрузок
#    cap_drop:
#      - ALL
#    cap_add:
#      - CHOWN          # смена владельца при копировании/перемещении
#      - DAC_OVERRIDE   # запись в каталоги чужих пользователей
#      - FOWNER         # смена прав и времени у чужих файлов
#      #- NET_BIND_SERVICE   # только для портов ниже 1024 (например 80)
#    security_opt:
#      - no-new-privileges:true
#    logging:
#      driver: json-file
#      options:
#        max-size: "10m"
#        max-file: "3"